name: Supabase CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: jintblmxigdclmcshrgz
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Apply Database Schema via PSQL
        if: ${{ env.SUPABASE_DB_PASSWORD != '' }}
        run: |
          echo "Installing postgresql-client if needed..."
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          echo "Applying all_in_one_migration.sql to Supabase database..."
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h aws-0-ap-northeast-2.pooler.supabase.com \
            -p 5432 \
            -U postgres.jintblmxigdclmcshrgz \
            -d postgres \
            -v ON_ERROR_STOP=0 \
            -f supabase/all_in_one_migration.sql
          echo "=== Verify tables in public schema ==="
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            -h aws-0-ap-northeast-2.pooler.supabase.com \
            -p 5432 \
            -U postgres.jintblmxigdclmcshrgz \
            -d postgres \
            -c "\dt"
          echo "Database schema migration completed successfully!"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '1.200.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Link Project
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref ${{ env.PROJECT_ID }} --password "$SUPABASE_DB_PASSWORD"
          else
            supabase link --project-ref ${{ env.PROJECT_ID }}
          fi
        continue-on-error: true

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy create-member --no-verify-jwt --yes || echo "Edge function deploy skipped"
        continue-on-error: true
