name: Build & Release Google Play AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Release AAB & APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Environment File
        run: cp .env.example .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Ensure Persistent Release Keystore
        run: |
          KEYSTORE_PATH="android/app/project_khata.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating persistent release keystore for consistent app updates..."
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias projectkhata \
              -storepass ProjectKhata2026 \
              -keypass ProjectKhata2026 \
              -dname "CN=Project Khata, OU=Mobile, O=Project Khata, L=Dhaka, C=BD"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_PATH"
            git commit -m "chore(release): generate persistent release keystore [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "Persistent release keystore already exists."
          fi

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-assets
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v1.0.0"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/ProjectKhata-${TAG_NAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-assets/ProjectKhata-${TAG_NAME}.aab"
          echo "Release assets prepared:"
          ls -la release-assets

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-khata-release-aab
          path: app/release-assets/*.aab
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-khata-release-apk
          path: app/release-assets/*.apk
          if-no-files-found: warn

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-khata-persistent-keystore
          path: app/android/app/project_khata.keystore
          if-no-files-found: warn

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v1.0.0"
          fi

          # Delete existing release for this tag if exists, then create fresh release
          gh release delete "$TAG_NAME" -y 2>/dev/null || true

          gh release create "$TAG_NAME" release-assets/* \
            --title "Project Khata $TAG_NAME" \
            --notes-file release_notes.md \
            --latest
