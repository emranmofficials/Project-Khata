plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.projectkhata.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.projectkhata.app"
        minSdk = 21
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def persistentKeystore = file('project_khata.keystore')
            if (persistentKeystore.exists()) {
                storeFile = persistentKeystore
                storePassword = "ProjectKhata2026"
                keyAlias = "projectkhata"
                keyPassword = "ProjectKhata2026"
            } else if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                def storeFilePath = keystoreProperties['storeFile']
                if (storeFilePath) {
                    def keystoreFile = file(storeFilePath)
                    if (!keystoreFile.exists()) {
                        keystoreFile = rootProject.file(storeFilePath)
                    }
                    storeFile = keystoreFile
                }
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig = (file('project_khata.keystore').exists() || (keystorePropertiesFile.exists() && keystoreProperties['storeFile'])) ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
